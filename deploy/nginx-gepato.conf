# Gepato-AI — nginx sayti (deploy/install.sh chizadi: __DOMAIN__ -> haqiqiy domen).
# Alohida server bloki; plagiatx.uz va NafasNazorat konfiguratsiyasiga tegmaydi.
# Cloudflare orqali kelsa haqiqiy IP — umumiy /etc/nginx/conf.d/cloudflare-realip.conf dan.

limit_req_zone $binary_remote_addr zone=gepato_req:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gepato_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Ovoz yozuvi 10 MB gacha (MAX_AUDIO_SIZE_MB) + multipart zaxirasi
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), accelerometer=(self), gyroscope=(self)" always;

    # Parol tanlashga qarshi: IP boshiga daqiqada 10 urinish
    location = /api/auth/login {
        limit_req zone=gepato_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/gepato-proxy.conf;
    }

    # Ovoz tahlili va AI agentlar uzoqroq ishlashi mumkin
    location /api/ {
        limit_req zone=gepato_req burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/gepato-proxy.conf;
        proxy_read_timeout 180s;
    }

    location /vendor/ {
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/gepato-proxy.conf;
        expires 30d;  # add_header bu yerda yo'q — aks holda server darajasidagi xavfsizlik sarlavhalari tushib qoladi
    }

    location / {
        limit_req zone=gepato_req burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/gepato-proxy.conf;
    }
}
